<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصر رقميًا — رحلة التحول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F8FC; --surface:#FFFFFF; --surface-2:#E8F0F8;
  --ink:#0E2A44; --ink-soft:#4C6178;
  --navy:#0E63B3; --navy-deep:#0A3E73; --gold:#4FA9E8;
  --line:rgba(14, 42, 68, 0.10);
  --shadow: 0 1px 2px rgba(14, 42, 68, 0.06);
  --radius-lg:22px; --radius-md:14px; --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B2B; --surface:#122436; --surface-2:#183246;
    --ink:#EAF2FA; --ink-soft:#A9C0D4;
    --navy:#5FA8E0; --navy-deep:#BFE0FA; --gold:#D4AF37;
    --line:rgba(234,242,250,.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.30);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1B2B; --surface:#122436; --surface-2:#183246;
  --ink:#EAF2FA; --ink-soft:#A9C0D4;
  --navy:#5FA8E0; --navy-deep:#BFE0FA; --gold:#7FC4F2;
  --line:rgba(234,242,250,.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.30);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Alexandria',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

header.site{
  position:sticky; top:0; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  box-shadow: 0 2px 0 0 var(--gold);
  padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px;
}
.wrap{max-width:1080px; margin:0 auto; padding:0 22px}
.navrow{display:flex; align-items:center; justify-content:space-between; gap:18px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; white-space:nowrap; color:var(--navy-deep)}
nav.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{
  white-space:nowrap; padding:8px 14px; border-radius:999px; color:var(--ink-soft);
  text-decoration:none; font-size:14px; font-weight:600; border:1px solid transparent;
}
nav.tabs a.active{background:var(--navy); color:#fff}
nav.tabs a:not(.active):hover{border-color:var(--line); color:var(--ink)}

main{max-width:1080px; margin:0 auto; padding:40px 22px 80px}
section.page{display:none}
section.page.active{display:block}

.hero{
  display:grid; grid-template-columns:1.3fr 1fr; gap:28px; align-items:stretch;
  background:var(--surface); color:var(--ink); border:1px solid var(--line); border-top:4px solid var(--gold);
  border-radius:var(--radius-lg); min-height:250px;
  padding:36px; margin-bottom:32px; position:relative; overflow:hidden;
}
.hero h1{font-size:32px; line-height:1.32; font-weight:800; margin:0 0 14px; color:var(--navy-deep); position:relative}
.hero p{font-size:15.5px; line-height:1.8; color:var(--ink-soft); max-width:48ch; margin:0; position:relative}
.hero-icon{display:flex; align-items:center; justify-content:center}
.hero-icon svg{width:100%; max-width:130px; height:auto; color:var(--navy)}

.statband{
  display:flex; gap:0; margin:0 0 38px; border:1px solid var(--line); border-radius:var(--radius-md);
  overflow:hidden; background:var(--surface);
}
.statband .stat{flex:1; padding:20px 16px; text-align:center; border-inline-start:1px solid var(--line)}
.statband .stat:first-child{border-inline-start:none}
.statband .stat b{display:block; font-size:22px; font-weight:800; color:var(--navy)}
.statband .stat span{display:block; margin-top:6px; font-size:13px; color:var(--ink-soft); line-height:1.55}

h2.section-title{font-size:21px; font-weight:800; margin:0 0 18px; color:var(--navy-deep)}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:34px}
.card{
  background:var(--surface); border:1px solid var(--line); border-top:2px solid var(--gold); border-radius:var(--radius-sm);
  padding:22px; display:flex; flex-direction:column; gap:12px;
}
.card svg{width:28px; height:28px; color:var(--gold)}
.card h3{margin:0; font-size:16px; font-weight:700}
.card p{margin:0; font-size:13.5px; line-height:1.8; color:var(--ink-soft)}

.homegrid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:34px}
.homegrid a{
  grid-column:span 1; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:20px; display:flex; flex-direction:column; gap:10px; min-height:138px;
}
.homegrid a:first-child{grid-column:span 3; background:var(--navy); color:#fff; border:none; min-height:150px; flex-direction:row; align-items:center; gap:20px}
.homegrid a:first-child svg{color:var(--gold); width:34px; height:34px; flex:none}
.homegrid a:first-child .lbl{color:#DCEBF9}
.homegrid a svg{width:24px;height:24px;color:var(--gold)}
.homegrid h3{margin:0; font-size:15px; font-weight:700}
.homegrid .lbl{font-size:12.5px; color:var(--ink-soft)}

.linklist{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:34px}
.linklist a{
  text-decoration:none; color:inherit; display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:14px 16px;
}
.linklist a:hover{border-color:var(--navy)}
.linklist .dot{width:8px;height:8px;border-radius:50%;background:var(--navy);flex:none}
.linklist .txt{display:flex; flex-direction:column; gap:2px; overflow:hidden}
.linklist .txt b{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.linklist .txt span{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.note{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px}

.cta{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 22px; background:var(--surface-2);
}
.cta span{font-size:14px; color:var(--ink-soft)}
.cta a{
  text-decoration:none; background:var(--navy); color:#fff; font-weight:700; font-size:14px;
  padding:10px 20px; border-radius:999px; white-space:nowrap;
}

footer{border-top:1px solid var(--line); padding:24px 0 calc(24px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft)}
footer h3{margin:0; font-size:12.5px; font-weight:500; color:var(--ink-soft)}

@media (max-width:760px){
  .navrow{flex-direction:column; align-items:stretch; gap:10px}
  nav.tabs{justify-content:flex-start}
  .hero{grid-template-columns:1fr; padding:26px; min-height:210px}
  .hero-icon{order:-1; max-width:80px; margin-inline-start:auto}
  .hero h1{font-size:24px}
  .statband{flex-wrap:wrap}
  .statband .stat{flex:1 1 50%; border-inline-start:none; border-top:1px solid var(--line)}
  .statband .stat:nth-child(-n+2){border-top:none}
  .grid{grid-template-columns:1fr}
  .homegrid{grid-template-columns:1fr 1fr}
  .homegrid a:first-child{grid-column:span 2; flex-direction:column; align-items:flex-start}
  .linklist{grid-template-columns:1fr}
}
</style>
</head>

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

tabsEl.innerHTML = PAGES.map(p => `<a href="#${p.key}" data-key="${p.key}">${p.nav}</a>`).join('');

function statBand(stats){
  return `<div class="statband">${stats.map(s=>`<div class="stat"><b>${s.v}</b><span>${s.l}</span></div>`).join('')}</div>`;
}
function cardGrid(cards){
  if(!cards) return '';
  return `<h2 class="section-title">أبرز الملامح</h2><div class="grid">${cards.map(c=>`
    <div class="card">${ICONS[c.icon]||''}<h3>${c.t}</h3><p>${c.d}</p></div>`).join('')}</div>`;
}
function homeLinks(links){
  return `<h2 class="section-title">استكشف الرحلة</h2><div class="homegrid">${links.map((l)=>`
    <a href="#${l.key}">${ICONS[PAGES.find(p=>p.key===l.key).icon]}<div><h3>${l.t}</h3><span class="lbl">${l.l}</span></div></a>`).join('')}</div>`;
}
function officialResources(){
  return `
    <h2 class="section-title">روابط ومصادر رسمية</h2>
    <div class="linklist">${OFFICIAL_LINKS.map(r=>`
      <a href="${r.u}" target="_blank" rel="noopener"><span class="dot"></span><span class="txt"><b>${r.t}</b><span>${r.d}</span></span></a>`).join('')}</div>
    <h2 class="section-title">فيديوهات ومصادر مرئية رسمية</h2>
    <p class="note">روابط بحث حقيقية على يوتيوب لقنوات جهات رسمية — تفتح نتائج فعلية وليست فيديو واحدًا مُحددًا مسبقًا.</p>
    <div class="linklist">${OFFICIAL_VIDEOS.map(r=>`
      <a href="${r.u}" target="_blank" rel="noopener"><span class="dot"></span><span class="txt"><b>${r.t}</b><span>${r.d}</span></span></a>`).join('')}</div>
  `;
}
function ctaNext(nextKey){
  if(!nextKey) return '';
  const next = PAGES.find(p=>p.key===nextKey);
  return `<div class="cta"><span>تابع الرحلة إلى الصفحة التالية</span><a href="#${nextKey}">${next.nav} ←</a></div>`;
}

function render(key){
  const page = PAGES.find(p=>p.key===key) || PAGES[0];
  mainEl.innerHTML = `
    <div class="hero">
      <div>
        <h1>${page.hero.title}</h1>
        <p>${page.hero.text}</p>
      </div>
      <div class="hero-icon">${ICONS[page.icon]}</div>
    </div>
    ${statBand(page.stats)}
    ${page.key==='home' ? homeLinks(page.home_links) + officialResources() : cardGrid(page.cards)}
    ${ctaNext(page.next)}
  `;
  [...tabsEl.children].forEach(a => a.classList.toggle('active', a.dataset.key === page.key));
}

function route(){
  const key = (location.hash || '#home').slice(1);
  render(PAGES.some(p=>p.key===key) ? key : 'home');
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', route);
route();
</script>
